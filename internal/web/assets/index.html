<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#181818">
<title>{{NAME}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230078d4'/%3E%3Cpath d='M11 6h10l6 10-6 10H11L5 16z' fill='none' stroke='white' stroke-width='2.6' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">
<script>
  // Apply the saved theme before first paint so there is no flash.
  // "dark" is the default; "light" and "auto" (follow the OS) are opt-in.
  try {
    const t = localStorage.getItem("theme") || "dark";
    const dark = t === "dark" || (t === "auto" && !matchMedia("(prefers-color-scheme: light)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.documentElement.dataset.themePref = t;
  } catch {}
</script>
</head>
<body>

<!-- Splash: the pigeon from internal/brand/art.go inside a hexagon traced
     by a comet. Cosmetic only; the workbench loads underneath. -->
<div id="splash" class="splash" aria-hidden="true" hidden>
  <div class="splash-inner">
    <div class="splash-hex">
      <svg viewBox="-8 -8 316 276" class="hex-svg">
        <defs>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <!-- Flat-topped hexagon; the path starts at the top-left vertex and
             runs clockwise, like the terminal splash. -->
        <path class="hex-base" pathLength="100" d="M75 0H225L300 130L225 260H75L0 130Z"/>
        <path class="hex-comet c3" pathLength="100" d="M75 0H225L300 130L225 260H75L0 130Z"/>
        <path class="hex-comet c2" pathLength="100" d="M75 0H225L300 130L225 260H75L0 130Z"/>
        <path class="hex-comet c1" pathLength="100" d="M75 0H225L300 130L225 260H75L0 130Z" filter="url(#glow)"/>
      </svg>
      <pre class="pigeon">{{PIGEON}}</pre>
    </div>
    <div class="splash-title">{{NAME}}</div>
    <div class="splash-tag">{{TAGLINE}}</div>
  </div>
</div>

<div class="app">
  <!-- Top bar: folders toggle, product, search, downloads, theme. -->
  <header class="topbar">
    <button id="menu-btn" class="tb-btn active" title="Toggle folders (⌘B)" aria-label="Toggle folders"><svg class="i"><use href="#i-sidebar"/></svg></button>
    <div class="tb-brand">
      <svg class="tb-logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M11 6h10l6 10-6 10H11L5 16z"/><circle cx="16" cy="16" r="3.2"/></svg>
      <span>{{NAME}}</span>
    </div>
    <button id="cc" class="search" aria-label="Search files and commands">
      <svg class="i"><use href="#i-search"/></svg>
      <span class="cc-label" id="cc-label">Search</span>
      <kbd class="cc-kbd" id="cc-kbd">⌘P</kbd>
    </button>
    <div class="tb-end">
      <button id="up-btn" class="tb-btn" title="Send files to this computer" aria-label="Send files to this computer" hidden>
        <svg class="i"><use href="#i-upload"/></svg>
      </button>
      <button id="dl-btn" class="tb-btn" title="Downloads (⌘J)" aria-label="Downloads">
        <svg class="i"><use href="#i-download"/></svg><span id="dl-badge" class="badge" hidden>0</span>
      </button>
      <button id="theme-btn" class="tb-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="i"><use href="#i-moon"/></svg>
      </button>
    </div>
  </header>

  <div class="workbench">
    <!-- Side bar: folder tree -->
    <aside class="sidebar" id="sidebar" aria-label="Folders">
      <div class="side-head"><span>Folders</span>
        <button class="icon-btn" id="collapse-all" title="Collapse folders" aria-label="Collapse folders"><svg class="i"><use href="#i-collapse"/></svg></button>
      </div>
      <div class="tree-root" id="tree-root" role="button" tabindex="-1"><svg class="i ic-folder"><use href="#i-folder"/></svg><span id="sb-root">Files</span></div>
      <ul class="tree" id="tree" role="tree"></ul>
    </aside>
    <div class="sash" id="sash" aria-hidden="true"></div>
    <div class="scrim" id="scrim" hidden></div>

    <!-- Main card: folder header, file table, downloads popover -->
    <main class="editor">
      <div class="folder-head">
        <div class="fh-text">
          <nav class="breadcrumbs" id="crumbs" aria-label="Path" hidden></nav>
          <h1 class="fh-title" id="folder-title">Files</h1>
        </div>
        <div class="fh-actions">
          <div class="sel-actions" id="sel-actions" hidden>
            <span class="sel-count" id="sel-count"></span>
            <button class="btn secondary" id="sel-clear">Clear</button>
            <button class="btn primary" id="sel-download"><svg class="i"><use href="#i-download"/></svg><span>Download</span></button>
          </div>
          <button class="icon-btn" id="layout-btn" title="Switch to grid view" aria-label="Switch to grid view"><svg class="i"><use href="#i-grid"/></svg></button>
          <button class="icon-btn" id="refresh" title="Refresh" aria-label="Refresh"><svg class="i"><use href="#i-refresh"/></svg></button>
        </div>
      </div>

      <div class="table" id="table">
        <div class="thead" role="row">
          <label class="cb" title="Select all"><input id="select-all" type="checkbox" aria-label="Select all"><span></span></label>
          <button class="th sort" data-sort="name">Name<span class="arrow"></span></button>
          <button class="th sort num col-size" data-sort="size">Size<span class="arrow"></span></button>
          <button class="th sort num col-date" data-sort="mtime">Modified<span class="arrow"></span></button>
          <span class="th col-act"></span>
        </div>
        <ul class="rows" id="list" role="listbox" aria-multiselectable="true" tabindex="0"></ul>
        <div class="empty" id="state" hidden></div>
      </div>

      <!-- Downloads: a popover under the top-bar button (a bottom sheet on phones) -->
      <section class="panel" id="panel" aria-label="Downloads" hidden>
        <div class="panel-head">
          <span class="panel-title">Downloads</span>
          <span class="panel-meta" id="panel-meta"></span>
          <span class="flex"></span>
          <button class="icon-btn" id="dl-clear" title="Clear finished" aria-label="Clear finished"><svg class="i"><use href="#i-clear"/></svg></button>
          <button class="icon-btn" id="panel-close" title="Close (⌘J)" aria-label="Close downloads"><svg class="i"><use href="#i-x"/></svg></button>
        </div>
        <ul class="dl-list" id="dl-list"></ul>
        <p class="dl-empty" id="dl-empty">No downloads yet. Click a file to download it, or select several to stream a ZIP that keeps the folder structure.</p>
      </section>
    </main>
  </div>

  <!-- Status line -->
  <footer class="statusbar">
    <span class="sb-item" id="sb-items"></span>
    <span class="sb-item" id="sb-sel" hidden></span>
    <span class="flex"></span>
    <span class="sb-item" id="sb-limit" hidden></span>
    <button class="sb-item" id="sb-dl" title="Toggle downloads"><svg class="i"><use href="#i-download"/></svg><span id="sb-dl-text">No downloads</span></button>
    <span class="sb-item hide-mobile" id="sb-auth"></span>
  </footer>
</div>

<!-- Command palette -->
<div class="palette-wrap" id="palette" hidden>
  <div class="palette" role="dialog" aria-label="Command palette">
    <input id="pal-input" type="text" autocomplete="off" spellcheck="false" placeholder="Search files by name, or type > for commands">
    <ul class="pal-list" id="pal-list" role="listbox"></ul>
  </div>
</div>

<!-- Preview: images, video, audio, PDFs, Markdown and code without leaving the page -->
<div class="preview-wrap" id="preview" hidden>
  <div class="preview" role="dialog" aria-modal="true" aria-label="Preview">
    <header class="pv-head">
      <span id="pv-icon"></span>
      <div class="pv-title"><span class="pv-name" id="pv-name"></span><span class="pv-meta" id="pv-meta"></span></div>
      <div class="pv-tools" id="pv-tools"></div>
      <button class="icon-btn" id="pv-prev" title="Previous (←)" aria-label="Previous"><svg class="i flip"><use href="#i-chev"/></svg></button>
      <button class="icon-btn" id="pv-next" title="Next (→)" aria-label="Next"><svg class="i"><use href="#i-chev"/></svg></button>
      <a class="icon-btn" id="pv-open" target="_blank" rel="noopener" title="Open in new tab" aria-label="Open in new tab"><svg class="i"><use href="#i-external"/></svg></a>
      <button class="icon-btn" id="pv-dl" title="Download" aria-label="Download"><svg class="i"><use href="#i-download"/></svg></button>
      <button class="icon-btn" id="pv-close" title="Close (Esc)" aria-label="Close preview"><svg class="i"><use href="#i-x"/></svg></button>
    </header>
    <div class="pv-body" id="pv-body"></div>
  </div>
</div>

<!-- Small modal dialog (share links) -->
<div class="dialog-wrap" id="dialog" hidden>
  <div class="dialog" role="dialog" aria-modal="true" id="dialog-box"></div>
</div>

<!-- Shown while files are dragged over the window (uploads) -->
<div class="drop" id="drop" hidden><div class="drop-box"><svg class="i"><use href="#i-upload"/></svg><span id="drop-text">Drop to send to this computer</span></div></div>
<input type="file" id="up-input" multiple hidden>

<div class="notifications" id="notes" aria-live="polite"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- Codicon-style 16px line icons -->
  <symbol id="i-files" viewBox="0 0 24 24"><path d="M14.5 3H8a1.5 1.5 0 0 0-1.5 1.5V17A1.5 1.5 0 0 0 8 18.5h9.5A1.5 1.5 0 0 0 19 17V7.5z"/><path d="M14.5 3v4.5H19"/><path d="M6.5 6.5H5A1.5 1.5 0 0 0 3.5 8v12.5A1.5 1.5 0 0 0 5 22h9.5a1.5 1.5 0 0 0 1.5-1.5v-2"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.5v12m0 0-4.5-4.5M12 15.5l4.5-4.5M4.5 20h15"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="m7 9.5 3 2.5-3 2.5M12.5 15H17"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
  <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
  <symbol id="i-collapse" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="13" height="13" rx="1.5"/><path d="M7 10h6M7.5 20.5h12a1 1 0 0 0 1-1v-12"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4v4.5H15"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-clear" viewBox="0 0 24 24"><path d="M4 6.5h16M4 11.5h10M4 16.5h7M15 15l5 5M20 15l-5 5"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3.2-3.2a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3.2 3.2a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-error" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m9 9 6 6M15 9l-6 6"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.1"/></symbol>
  <symbol id="i-hex" viewBox="0 0 24 24"><path d="M8 4h8l5 8-5 8H8l-5-8z"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19.5V5m0 0-6 6m6-6 6 6"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15.5v-12m0 0L7.5 8M12 3.5 16.5 8M4.5 20h15"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="17.5" cy="5.5" r="2.5"/><circle cx="6.5" cy="12" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/><path d="m8.7 10.8 6.6-4M8.7 13.2l6.6 4"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M13.5 4.5h6v6M19.5 4.5l-8 8M17 13.5v5a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 4 18.5v-10A1.5 1.5 0 0 1 5.5 7h5"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11M4 6.5h1.5M4 12h1.5M4 17.5h1.5"/></symbol>
  <!-- File-type glyphs (filled, coloured per type in CSS) -->
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M2.5 6.5A1.5 1.5 0 0 1 4 5h5.2l2 2.2H20a1.5 1.5 0 0 1 1.5 1.5v9.8A1.5 1.5 0 0 1 20 20H4a1.5 1.5 0 0 1-1.5-1.5z"/></symbol>
  <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="M2.5 6.5A1.5 1.5 0 0 1 4 5h5.2l2 2.2H19a1.5 1.5 0 0 1 1.5 1.5V10H7.4a1.5 1.5 0 0 0-1.4 1L3.4 19.3a1 1 0 0 1-.9-1z"/><path d="M6.8 11.2a1 1 0 0 1 .9-.7h14.6a.8.8 0 0 1 .7 1.1l-2.6 7.7a1 1 0 0 1-.9.7H4.1z" opacity=".75"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 2.5h8l5 5V20a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20V4a1.5 1.5 0 0 1 1-1.5z" opacity=".9"/><path d="M14 2.5v5h5" style="fill:none;stroke:var(--cut);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.7" style="fill:var(--cut);stroke:none"/><path d="m4 18 5-5 3.5 3.5L15 14l5 4.5" style="fill:none;stroke:var(--cut);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="m10 9 5 3-5 3z" style="fill:var(--cut);stroke:none"/></symbol>
  <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 5.5 20 3v12.5a2.5 2.5 0 1 1-2-2.45V7.1l-7 1.6v8.8A2.5 2.5 0 1 1 9 15z"/></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24"><path d="M5 3h14a1.5 1.5 0 0 1 1.5 1.5v15A1.5 1.5 0 0 1 19 21H5a1.5 1.5 0 0 1-1.5-1.5v-15A1.5 1.5 0 0 1 5 3z"/><path d="M12 3v2m0 2v2m0 2v2" style="fill:none;stroke:var(--cut);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round"/><rect x="10.5" y="13" width="3" height="4" rx=".8" style="fill:none;stroke:var(--cut);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round"/></symbol>
  <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M6 2.5h8l5 5V20a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20V4a1.5 1.5 0 0 1 1-1.5z"/><path d="M8 17c2.2-1 4.7-6 4.1-8-.4-1.4-1.8-.4-1.2 1.5.7 2.2 3 4.6 4.8 4.8 1.5.2 1.3-1.2-.4-1.2-1.8 0-5.2 1.3-7.3 2.9z" style="fill:none;stroke:var(--cut);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round"/></symbol>
</svg>

<script type="module" src="/assets/app.js"></script>
</body>
</html>
